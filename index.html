<!-- Booking Form UI Panel -->
 
<!-- The Booking Panel Popup Overlay -->
<div id="booking-panel" style="display: none;">
  <div class="panel-content">
    <h3 id="selected-room-title">Book Room</h3>
    
    <!-- Time Selector -->
    <div class="form-group">
      <label for="booking-time">Select Date & Time:</label>
      <input type="datetime-local" id="booking-time" required>
    </div>

    <hr>
    <h4>Remarks & Requirements</h4>

    <!-- Booking For (Text Input) -->
    <div class="form-group">
      <label for="booking-for">Booking For (Event Name):</label>
      <input type="text" id="booking-for" placeholder="e.g., Guest Lecture">
    </div>

    <!-- Carpets Needed (Number Input) -->
    <div class="form-group">
      <label for="carpets">Carpets Needed (Qty):</label>
      <input type="number" id="carpets" min="0" value="0">
    </div>

    <!-- Total Viewers (Number Input) -->
    <div class="form-group">
      <label for="total-viewers">Total Viewers (Qty):</label>
      <input type="number" id="total-viewers" min="0" value="0">
    </div>

    <!-- Class(es) Viewing (Dropdown Multi/Single Selection Option) -->
    <div class="form-group">
      <label for="class-viewing">Class(es) Viewing:</label>
      <select id="class-viewing">
        <option value="">-- Select Class --</option>
        <option value="Class 1-5">Class 1 to 5</option>
        <option value="Class 6-8">Class 6 to 8</option>
        <option value="Class 9-10">Class 9 to 10</option>
        <option value="Class 11-12">Class 11 to 12</option>
      </select>
    </div>

    <!-- Sections Viewing (Dropdown Multi/Single Selection Option) -->
    <div class="form-group">
      <label for="sections-viewing">Sections Viewing:</label>
      <select id="sections-viewing">
        <option value="">-- Select Section --</option>
        <option value="A-B">Sections A & B</option>
        <option value="C-D">Sections C & D</option>
        <option value="All Sections">All Sections</option>
      </select>
    </div>

    <!-- Chairs Needed (Number Input) -->
    <div class="form-group">
      <label for="chairs">Chairs Needed (Qty):</label>
      <input type="number" id="chairs" min="0" value="0">
    </div>

    <!-- Other Requirements (Textarea Input) -->
    <div class="form-group">
      <label for="other-requirements">Other Requirements:</label>
      <textarea id="other-requirements" rows="3" placeholder="Any extra sound systems, projector setup, etc..."></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="button-container">
      <button id="submit-booking">Confirm Booking</button>
      <button id="close-panel" type="button">Cancel</button>
    </div>
  </div>
</div>
